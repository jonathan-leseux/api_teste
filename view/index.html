<!DOCTYPE html> <!--declara que este documento segue o padrao HTML 5-->
<html lang="pt-BR"><!--define o idioma principal do documento como Portugues do Brasil-->

    <head><!--cabeçalho do documento contendo metadadose links externos-->
        <meta charset="UTF-8"><!--define a codificação de caracteres UFT-8 como suporte a acentos-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--garante suporte a telas responsivas em dispositivos moveis-->
        <title>Tarefas App</title><!--define o titulo que aparece na aba do navegador-->

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/boorstrap.min.css" rel="stylesheet"><!--link de importação da folha de estilos (CSS) do bootstrap-->
    </head><!--fechamento da seção de metadados-->

    <body><!--corpo da pagina onde fica o conteudo visivel para o usuario-->
        <!--container do spinner do carregamento-->
        <div class="d-flex justify-content-center">
            <!--div que reinderiza o efeito visual de carregamento rotativo-->
            <div class="spinner-border" role="status" id="loading">
                <!--texto oculto para leitores de tela indicando estado de carregamento-->
                <span class="sr-only"></span>
            </div><!--fechamento do elemento spinner-->
        </div><!--fechamento do container flex-->

        <!--titulo da seção centralizada usada uma classe utilitaria do BootStrap-->
        <p class="h1 text-center">Tarefas de um usuário</p>
        <!--estrutura da tabela HTML estilizada com as classes utilitarias do bootstrap-->
        <table class="table table-hover" id="tasks">
                <!--conteudo interno (cabeçalhos e linhas) será inserido via Script.js-->
        </table>
        <!--Script para componentes interativos do bootstrap-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
        <!--Importaçao do arquivo Script.js próprio contendo a logica de interação com a API-->
        <script src="script.js"></script>
    </body><!--fechamento do corpo do documento-->
</html><!--fechamento da tag raiz do HTML-->
